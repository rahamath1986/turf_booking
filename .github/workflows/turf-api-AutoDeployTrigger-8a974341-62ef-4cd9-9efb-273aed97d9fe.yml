name: Trigger auto deployment for turf-api

# When this action will be executed
on:
  # Automatically trigger it ONLY when detected changes in backend folder
  push:
    branches: 
      - main
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '!backend/docs/**'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # This is required for requesting the OIDC JWT Token
      contents: read # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TURFAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TURFAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TURFAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: turfregistry.azurecr.io
          registryUsername: ${{ secrets.TURFAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TURFAPI_REGISTRY_PASSWORD }}
          containerAppName: turf-api
          resourceGroup: rg-sansamg-platform
          imageToBuild: turfregistry.azurecr.io/turf-backend:${{ github.sha }}
