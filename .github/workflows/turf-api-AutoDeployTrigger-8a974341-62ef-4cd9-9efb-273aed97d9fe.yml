name: Trigger auto deployment for turf-api

on:
  push:
    branches: 
      - main
    paths:
      - "backend/**"
      - "!backend/**/*.md"
      - "!backend/docs/**"
      - ".github/workflows/turf-api-AutoDeployTrigger*"

  # Trigger on commit
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/rahamath1986/turf_booking:latest
            ghcr.io/rahamath1986/turf_booking:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rahamath1986/turf_booking

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 0fc917dd-2453-4598-a2ed-c0c59bf73d60
          tenant-id: 5ae56ac5-3d34-4213-83ca-2b8ffd870af0
          subscription-id: 133e33e9-63f9-4693-9a3c-e3ce9c75a5ee

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name turf-api \
            --resource-group rg-sansamg-platform \
            --image ghcr.io/rahamath1986/turf_booking:latest
