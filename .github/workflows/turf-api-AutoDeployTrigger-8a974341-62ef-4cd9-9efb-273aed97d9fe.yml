name: Trigger auto deployment for turf-api

on:
  push:
    branches: 
      - main
    paths:
      - "backend/**"
      - "!backend/**/*.md"
      - "!backend/docs/**"
      - ".github/workflows/turf-api-AutoDeployTrigger*"

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/rahamath1986/turf-backend:latest
            ghcr.io/rahamath1986/turf-backend:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TURFAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TURFAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TURFAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: turf-api
          resourceGroup: rg-sansamg-platform
          imageToDeploy: ghcr.io/rahamath1986/turf-backend:${{ github.sha }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
