name: Trigger auto deployment for turf-admin

# When this action will be executed
on:
  # Automatically trigger it ONLY when detected changes in admin-panel folder
  push:
    branches:
      - main
    paths:
      - 'admin-panel/**'
      - '!admin-panel/**/*.md'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the OIDC JWT Token
      contents: read # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TURFAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TURFAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TURFAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/admin-panel
          dockerfilePath: Dockerfile
          registryUrl: turfregistry.azurecr.io
          registryUsername: ${{ secrets.TURFAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TURFAPI_REGISTRY_PASSWORD }}
          containerAppName: turf-admin
          resourceGroup: rg-sansamg-platform
          imageToBuild: turfregistry.azurecr.io/turf-admin:${{ github.sha }}
          ingress: external
          targetPortIngress: 3000
          buildArguments: |
            NEXT_PUBLIC_API_URL=https://turf-api.gentlerock-8d88694a.centralindia.azurecontainerapps.io/api/v1
